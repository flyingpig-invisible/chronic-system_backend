server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: chronic-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/chronic_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.chronic.**.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 2
      logic-not-delete-value: 0

# JWT 配置
chronic:
  # ⚠️ 本地演示开关：true 时 /device/** 与 /mp/device/** 免登录，方便在 Knife4j 里直接调试
  #    仅用于课程演示与本机联调，提交/部署前必须改成 false
  dev-open: true
  jwt:
    secret: chronicDiseaseManagementSystemSecretKey2026ForJwtTokenSigning
    expire: 604800000
    header: Authorization
    prefix: "Bearer "
  upload-path: D:/software/chronic-system/upload
  # AI 健康助手（DeepSeek）
  ai:
    enabled: true
    base-url: https://api.deepseek.com
    api-key: sk-b0fa92a1cac442628830fe87eec04365
    model: deepseek-chat
    timeout: 60000
    temperature: 0.3
    max-tokens: 1500

# 接口文档
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    root: info
    com.chronic: debug
