server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: mysql          # 本地跑不起来可改用 h2：--spring.profiles.active=h2
  application:
    name: chronic-server
  sql:
    init:
      mode: always         # 每次启动重建表并灌种子数据（演示用）
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

logging:
  level:
    com.gzu.chronic: info
    org.springframework.jdbc: warn
